name: shared objects

# Cosmopolitan as a shared library, on the three hosts that can load one.
#
# The PE and mach-o images are built on linux, where the toolchain runs,
# and carried to the machines they were emitted for. Those are the only
# ones that can say whether the headers are right, since nothing on linux
# loads either format.
#
# The ELF side is a different test, and the harder one: there the libc has
# to be built as position independent code and then live inside a process
# whose libc is somebody else's.

env:
  COSMOCC_VERSION: 3.9.2
  COSMOCC_SHA256: f4ff13af65fcd309f3f1cfd04275996fb7f72a4897726628a8c9cf732e850193

on:
  push:
    branches: ["master", "ape-dso-poc", "dll"]
  pull_request:
  workflow_dispatch:

jobs:
  dll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch the toolchain
        run: |
          build/download-cosmocc.sh \
            ".cosmocc/${COSMOCC_VERSION}" \
            "${COSMOCC_VERSION}" \
            "${COSMOCC_SHA256}"

      - name: build the dll
        run: test/ape/dll/build.sh windows

      - name: check what came out
        run: |
          # a PE image begins with MZ
          head -c2 o/dlltest/cosmo_dll_test.dll | od -An -c | grep -q 'M   Z'
          # and has to say it's a library rather than a program, which
          # lives in the pe characteristics word, so -p and not -f
          objdump -p o/dlltest/cosmo_dll_test.dll | grep -q DLL

      - uses: actions/upload-artifact@v4
        with:
          name: dll
          path: o/dlltest/cosmo_dll_test.dll

  dylib:
    runs-on: ubuntu-latest
    # The libc is built as position independent code for this one, which
    # is a build of its own, so it can't share a machine with the dll.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: fetch the toolchain
        run: |
          build/download-cosmocc.sh \
            ".cosmocc/${COSMOCC_VERSION}" \
            "${COSMOCC_VERSION}" \
            "${COSMOCC_SHA256}"

      - name: build the dylib
        run: test/ape/dll/build.sh macos

      - name: check what came out
        run: |
          # a mach-o begins with its own magic
          head -c4 o/dlltest/cosmo_dll_test.dylib | od -An -tx1 | grep -q 'cf fa ed fe'
          # dlsym is answered from the export trie, so the names have to
          # be in there
          grep -q cosmo_dylib_boot o/dlltest/cosmo_dll_test.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: dylib
          path: o/dlltest/cosmo_dll_test.dylib

  aarch64:
    runs-on: ubuntu-latest
    # The first question a native arm64 library has to answer is whether
    # the libc builds for it at all as position independent code with the
    # guest paths turned on. Everything else waits on that.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: fetch the toolchain
        run: |
          build/download-cosmocc.sh \
            ".cosmocc/${COSMOCC_VERSION}" \
            "${COSMOCC_VERSION}" \
            "${COSMOCC_SHA256}"

      - name: build the dylib for apple silicon
        run: EXTRA_CFLAGS=-DAPE_DYLIB_NO_AUTOBOOT test/ape/dll/build.sh arm64

      - name: check what came out
        run: |
          head -c4 o/dlltest/cosmo_dll_test.dylib | od -An -tx1 | grep -q 'cf fa ed fe'
          # the cpu type has to say arm64, or the loader won't look twice
          od -An -tx4 -j4 -N4 o/dlltest/cosmo_dll_test.dylib | grep -q '0100000c'
          grep -q cosmo_dylib_boot o/dlltest/cosmo_dll_test.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: dylib-arm64
          path: o/dlltest/cosmo_dll_test.dylib

  linux:
    runs-on: ubuntu-latest
    # Most of this is building the libc twice over: as position independent
    # code, which is a full build of its own.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: fetch the toolchain
        run: |
          build/download-cosmocc.sh \
            ".cosmocc/${COSMOCC_VERSION}" \
            "${COSMOCC_VERSION}" \
            "${COSMOCC_SHA256}"

      - name: build the libc as a shared object
        run: test/ape/dso/build.sh

      - name: nothing absolute is left in it
        run: |
          # an ET_DYN link is what proves this, and it already happened,
          # but a text relocation means it only got there by making the
          # loader write to the code, which is not the same thing
          ! readelf -d o/dsotest/cosmo_dso_test.so | grep -q TEXTREL
          readelf -h o/dsotest/cosmo_dso_test.so | grep -q 'DYN'

      - name: load it
        run: o/dsotest/host o/dsotest/cosmo_dso_test.so

  windows:
    needs: dll
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dll
      - name: load it
        shell: bash
        run: |
          # msvc needs the developer environment set up before cl is on
          # PATH; the runner ships clang and gcc ready to use, and the
          # host program is plain win32, so either will do
          for cc in clang gcc cc; do
            if command -v $cc >/dev/null; then CC=$cc; break; fi
          done
          test -n "${CC:-}" || { echo "no c compiler on this runner"; exit 1; }
          echo "building the host with $CC"
          "$CC" -o host.exe test/ape/dll/host.c
          ./host.exe

  macos-arm64:
    needs: aarch64
    # The runners are apple silicon, so this one is native, and native
    # arm64 code has to be signed before the kernel will run it. Ad hoc
    # is enough: it says the file hasn't been tampered with since, not
    # who made it.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dylib-arm64
      - name: load it
        run: |
          uname -m
          file cosmo_dll_test.dylib
          codesign -s - --force cosmo_dll_test.dylib
          codesign -dv cosmo_dll_test.dylib 2>&1 | head -5 || true
          dyld_info -exports cosmo_dll_test.dylib || true
          otool -l cosmo_dll_test.dylib | grep -A6 -E "cmd LC_SEGMENT_64|LC_CODE_SIGNATURE" |
            grep -E "segname|fileoff|filesize|vmaddr|vmsize|dataoff|datasize" || true
          ls -l cosmo_dll_test.dylib
          clang -o host test/ape/dll/host.c
          # let the loader say how far it gets before it stops
          DYLD_PRINT_SEGMENTS=1 ./host 2>&1 | tail -30 || true
          ./host

  macos:
    needs: dylib
    # The library ape emits today is x86-64, and the free runners are all
    # apple silicon now, so the host is built for intel too and the pair
    # runs under Rosetta. A native arm64 library needs the aarch64 path in
    # ape.S and a code signature, neither of which exists yet.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dylib
      - name: load it
        run: |
          uname -m
          file cosmo_dll_test.dylib
          # what does the platform's own tooling make of it
          otool -l cosmo_dll_test.dylib | head -60 || true
          echo "--- exports as dyld sees them ---"
          dyld_info -exports cosmo_dll_test.dylib || true
          # dlsym is answered from the trie, so an empty listing above is
          # the failure to look at even when nm below has plenty to say
          echo "--- what dyld makes of the rebase information ---"
          dyld_info -fixups cosmo_dll_test.dylib | head -20 || true
          echo "--- now try to use it ---"
          clang -arch x86_64 -o host test/ape/dll/host.c
          ./host
